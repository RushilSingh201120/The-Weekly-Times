
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | The Weekly Times</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>The Weekly Times</h1>
        <p>Your source for the latest approved news.</p>
    </header>

    <main>
        <section class="auth-container">
            <h2>Create Your Account</h2>

            <p class="auth-intro">
                Join The Weekly Times as a reader or journalist.
            </p>

            <form method="post" class="content-form">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">Create Account</button>
            </form>

            <p class="auth-link">
                Already have an account?
                <a href="{% url 'login' %}">Log in here</a>
            </p>

            <p class="back-link">
                <a href="{% url 'news:article_list' %}">
                    Back to Home
                </a>
            </p>
        </section>
    </main>
</body>
</html>
